<!-- FAQItem (§3.1). Native details/summary - the question is in the DOM as text
     whether the item is open or closed. No JavaScript accordion. -->
<details class="faq-item">
  <summary class="faq-q"><span>{{q}}</span><span class="faq-icon" aria-hidden="true"></span></summary>
  <div class="faq-a">{{a}}</div>
</details>

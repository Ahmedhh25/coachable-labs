<!-- CTABlock (§3.1). Heading and body vary per page; the two actions never do. -->
<section class="cta-block" id="contact">
  <div class="container narrow center-col">
    <h2 class="cta-heading">{{ctaHeading}}</h2>
    <p class="cta-body">{{ctaBody}}</p>

    <a href="/book-a-call/" class="cta-secondary">Or book a 30-minute call</a>
  </div>
</section>
